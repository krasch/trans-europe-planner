name: Check code formatting, run unit tests, etc
on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v3

      - name: Install javascript modules
        run: npm install

      - name: Check code formatting
        run: npm run check-pretty

      - name: Check types
        run: npm run check-types

      - name: Run tests
        run: npm test
        
